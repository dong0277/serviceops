[project]
name = "serviceops-api"
version = "0.1.0"
description = "FastAPI service for ServiceOps"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.19.1",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
